name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor in `engines`; 24 is what the packaged app runs today.
        node-version: ["20", "22", "24"]
    steps:
      - name: Check out this package
        uses: actions/checkout@v4

      # The suite's central guarantee is that this JavaScript state kernel
      # produces byte-identical output to upstream's Python store, so the
      # upstream checkout has to sit next to this package (the test resolves
      # `../Learning-Accelerator`). Deliberately not `continue-on-error`: if the
      # upstream repo ever moves, the equivalence test would go back to
      # *skipping*, and a silently skipped guarantee is worse than a red build.
      - name: Check out upstream Learning-Accelerator alongside this package
        run: git clone --depth 1 https://github.com/Maolipeng/Learning-Accelerator.git ../Learning-Accelerator

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The peer packages are what the host app provides at runtime; they are
      # installed here only so the host half can be loaded by tests.
      #
      # Do not install `latest`: @deepseek-ai/dsh-tools' `latest` tag is
      # 0.0.1-rc.1, which does not satisfy this package's `>=0.1.0-rc.5` peer
      # range. 0.2.0-rc.2 is the runtime this plugin was verified against.
      # Bump these two pins together with the `engines`/peer range.
      - name: Install the host peer packages
        run: |
          npm install --no-save --no-package-lock \
            @deepseek-ai/cordis@^4.0.4 \
            @deepseek-ai/schemastery@^3.18.2 \
            @deepseek-ai/dsh-tools@0.2.0-rc.2 \
            @deepseek-ai/dsh-system-prompt@0.2.0-rc.2

      - name: Run the suite
        run: node --test tests/*.test.js
